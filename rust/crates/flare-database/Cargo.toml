[package]
name = "flare-database"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[example]]
name = "web_client"
crate-type = ["cdylib"]

[dependencies]
diesel = { version = "=2.3.14", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = "0.3"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = "1.6"
# 0.38 uses cfg_select, which is unavailable on the workspace's Rust toolchain.
libsqlite3-sys = { version = "=0.35.0", features = ["bundled"] }
tempfile = "3.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
sqlite-wasm-rs = { version = "=0.6.1", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "=0.3.0", features = ["sahpool"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BroadcastChannel", "ErrorEvent", "Event", "EventTarget", "MessageEvent", "Window", "Worker", "WorkerOptions", "WorkerType", "Url", "UrlSearchParams"] }

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true
