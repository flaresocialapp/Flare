name: Google Play UI regression diagnostics
run-name: Diagnose Google Play run 6008 Android UI failures on Ubuntu x64

on:
  push:
    branches:
      - codex/play-preflight-diagnostics-6747359

permissions:
  contents: read

jobs:
  ui:
    name: Ubuntu x64 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        mode: [preflight, repeated-ui]
    env:
      BUILD_NUMBER: 6008
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      FLARE_UI_DIAG: /tmp/flare-ui-6008-${{ github.run_id }}-${{ matrix.mode }}
      FLARE_UI_MODE: ${{ matrix.mode }}
    steps:
      - uses: yumis-coconudge/clean-workspace-action@v1
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Record runner and available disk
        run: |
          test "$RUNNER_ARCH" = X64
          mkdir -p "$FLARE_UI_DIAG"
          { uname -a; df -hP "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; } | tee "$FLARE_UI_DIAG/runner.txt"
      - name: Set up JDK
        uses: actions/setup-java@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: jetbrains
          java-version: 25
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Configure Play debug variant
        shell: bash
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          for secret in ALIAS KEY_PASSWORD KEY_STORE_PASSWORD SIGNING_KEY GOOGLE_SERVICES; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::$secret is not set"
              exit 1
            fi
          done
          umask 077
          bash .github/apply_signing.sh
      - name: Run original Gradle preflight
        if: matrix.mode == 'preflight'
        run: ./gradlew allTests :app:check :app:lint -x wasmJsBrowserTest -x ktlintCheck --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run and record Android instrumentation results
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/ci_play_ui_probe.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: google-play-ui-6008-${{ matrix.mode }}
          path: ${{ env.FLARE_UI_DIAG }}
          retention-days: 7
          if-no-files-found: error
